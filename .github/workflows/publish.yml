name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write   # OIDC token for NuGet Trusted Publishing (no stored API key)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gcf-dotnet
        uses: actions/checkout@v4
        with:
          path: gcf-dotnet

      # Conformance fixtures live in a sibling gcf checkout (../gcf/tests/conformance),
      # the same pattern the other SDKs use.
      - name: Checkout gcf (conformance fixtures)
        uses: actions/checkout@v4
        with:
          repository: blackwell-systems/gcf
          path: gcf

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Build (multi-target, zero-dependency)
        working-directory: gcf-dotnet
        run: dotnet build -c Release

      - name: Test (full conformance suite)
        working-directory: gcf-dotnet
        run: dotnet test -c Release --no-build

      - name: Pack
        working-directory: gcf-dotnet
        run: dotnet pack src/BlackwellSystems.Gcf -c Release --no-build -o out

      # Trusted Publishing: exchange the GitHub OIDC token for a short-lived NuGet
      # API key. Requires a trusted-publishing policy on nuget.org tying this repo +
      # workflow to the package owner (vars.NUGET_USER), and no stored secret.
      - name: NuGet trusted-publishing login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to NuGet
        working-directory: gcf-dotnet
        run: dotnet nuget push "out/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
